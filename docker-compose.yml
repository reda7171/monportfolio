version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wedev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedev
      POSTGRES_PASSWORD: wedev_secret_2024
      POSTGRES_DB: wedev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedev -d wedev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
